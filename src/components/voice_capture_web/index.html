
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 0;
      width: 100%;
      color: #0f172a;
      font: 14px system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      padding: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button {
      min-height: 42px;
      padding: 8px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      background: white;
      color: #0f172a;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button.primary {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    audio {
      display: block;
      width: 100%;
      margin: 12px 0;
    }

    audio[hidden] {
      display: none;
    }

    #download {
      display: inline-block;
      margin-top: 8px;
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      color: #0f172a;
      text-decoration: none;
    }

    #download[hidden],
    #recording-time[hidden] {
      display: none;
    }

    #status {
      min-height: 22px;
      margin: 8px 0;
      color: #475569;
    }

    #recording-time {
      margin: 8px 0;
      color: #b42318;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>

  <div class="row">
    <button id="record" type="button">
      Start recording
    </button>

    <button id="save" class="primary" type="button">
      Create account
    </button>

    <button id="clear" type="button">
      Clear sample
    </button>
  </div>

  <div id="recording-time" role="timer" aria-live="off" hidden>
    Recording time: 00:00
  </div>

  <div id="status" role="status" aria-live="polite">
    Record a clear voice sample. The action button stops and submits it automatically.
  </div>

  <audio id="preview" controls hidden></audio>

  <a id="download" hidden download="voice_sample.wav">
    Download recording
  </a>

  <script>
    "use strict";

    const recordButton = document.getElementById("record");
    const saveButton = document.getElementById("save");
    const clearButton = document.getElementById("clear");
    const status = document.getElementById("status");
    const recordingTime = document.getElementById("recording-time");
    const preview = document.getElementById("preview");
    const download = document.getElementById("download");

    let stream = null;
    let recorder = null;
    let chunks = [];
    let wavBytes = null;

    let requestId = 0;
    let submitAfterStop = false;
    let discardAfterStop = false;

    let maxRecordingTimer = null;
    let recordingClockInterval = null;
    let recordingStartedAt = 0;
    let maxDurationReached = false;

    // ---------------------------------
    // Streamlit communication
    // ---------------------------------

    function post(type, value = {}) {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: type,
        ...value
      }, "*");
    }

    // ---------------------------------
    // Dynamic iframe height
    // ---------------------------------

    function setHeight() {
      const height = Math.ceil(
        Math.max(
          document.body.scrollHeight,
          document.documentElement.scrollHeight
        )
      );

      post("streamlit:setFrameHeight", {
        height: height
      });
    }

    function scheduleHeightUpdate() {
      requestAnimationFrame(() => {
        setHeight();

        requestAnimationFrame(setHeight);
      });
    }

    if (typeof ResizeObserver !== "undefined") {
      const resizeObserver = new ResizeObserver(() => {
        setHeight();
      });

      resizeObserver.observe(document.body);
    }

    window.addEventListener("load", scheduleHeightUpdate);
    window.addEventListener("resize", scheduleHeightUpdate);

    // ---------------------------------
    // Recording timer
    // ---------------------------------

    function updateRecordingTime() {
      if (!recordingStartedAt) return;

      const seconds = Math.floor(
        (Date.now() - recordingStartedAt) / 1000
      );

      const minutesText = String(
        Math.floor(seconds / 60)
      ).padStart(2, "0");

      const secondsText = String(
        seconds % 60
      ).padStart(2, "0");

      recordingTime.textContent =
        `Recording time: ${minutesText}:${secondsText}`;
    }

    // ---------------------------------
    // Base64 conversion
    // ---------------------------------

    function bytesToBase64(bytes) {
      let binary = "";
      const step = 0x8000;

      for (let i = 0; i < bytes.length; i += step) {
        binary += String.fromCharCode(
          ...bytes.subarray(i, i + step)
        );
      }

      return btoa(binary);
    }

    // ---------------------------------
    // Convert audio to WAV
    // 16 kHz, mono, PCM 16-bit
    // ---------------------------------

    async function toWav(blob) {
      const context = new AudioContext();

      try {
        const decoded = await context.decodeAudioData(
          await blob.arrayBuffer()
        );

        const targetRate = 16000;

        const frameCount = Math.ceil(
          decoded.duration * targetRate
        );

        if (frameCount <= 0) {
          throw new Error("Empty recording");
        }

        const offline = new OfflineAudioContext(
          1,
          frameCount,
          targetRate
        );

        const source = offline.createBufferSource();

        source.buffer = decoded;
        source.connect(offline.destination);
        source.start();

        const rendered = await offline.startRendering();
        const samples = rendered.getChannelData(0);

        const buffer = new ArrayBuffer(
          44 + samples.length * 2
        );

        const view = new DataView(buffer);

        const write = (offset, value) => {
          [...value].forEach((character, index) => {
            view.setUint8(
              offset + index,
              character.charCodeAt(0)
            );
          });
        };

        write(0, "RIFF");
        view.setUint32(
          4,
          36 + samples.length * 2,
          true
        );

        write(8, "WAVE");
        write(12, "fmt ");

        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, targetRate, true);
        view.setUint32(28, targetRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);

        write(36, "data");

        view.setUint32(
          40,
          samples.length * 2,
          true
        );

        for (let i = 0; i < samples.length; i++) {
          const sample = Math.max(
            -1,
            Math.min(1, samples[i])
          );

          view.setInt16(
            44 + i * 2,
            sample < 0
              ? sample * 0x8000
              : sample * 0x7fff,
            true
          );
        }

        return new Uint8Array(buffer);

      } finally {
        await context.close();
      }
    }

    // ---------------------------------
    // Timer cleanup
    // ---------------------------------

    function clearRecordingTimers() {
      if (maxRecordingTimer) {
        clearTimeout(maxRecordingTimer);
        maxRecordingTimer = null;
      }

      if (recordingClockInterval) {
        clearInterval(recordingClockInterval);
        recordingClockInterval = null;
      }
    }

    // ---------------------------------
    // Finish recording
    // ---------------------------------

    async function finishRecording() {
      clearRecordingTimers();

      if (recordingStartedAt) {
        updateRecordingTime();
      }

      if (discardAfterStop) {
        discardAfterStop = false;
        submitAfterStop = false;

        chunks = [];
        wavBytes = null;

        preview.removeAttribute("src");
        preview.hidden = true;

        download.hidden = true;
        recordingTime.hidden = true;

        recordingStartedAt = 0;

        status.textContent =
          "Sample cleared. Record a clear voice sample.";

      } else {
        try {
          if (!chunks.length) {
            throw new Error("No audio captured");
          }

          const blob = new Blob(chunks, {
            type: recorder?.mimeType || "audio/webm"
          });

          wavBytes = await toWav(blob);

          const audioBlob = new Blob(
            [wavBytes],
            { type: "audio/wav" }
          );

          if (preview.src.startsWith("blob:")) {
            URL.revokeObjectURL(preview.src);
          }

          preview.src = URL.createObjectURL(audioBlob);
          preview.hidden = false;

          download.href = preview.src;
          download.hidden = false;

          status.textContent = maxDurationReached
            ? "Maximum 10-minute recording ready."
            : "Sample ready.";

          saveButton.disabled = false;

          if (submitAfterStop) {
            submitAfterStop = false;
            submitSample();
          }

        } catch (error) {
          console.error("Recording preparation failed:", error);

          status.textContent =
            "Could not prepare the recording. Please try again.";

          saveButton.disabled = false;
          submitAfterStop = false;
        }
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      stream = null;
      recorder = null;

      recordButton.textContent = "Start recording";
      recordButton.disabled = false;

      scheduleHeightUpdate();
    }

    // ---------------------------------
    // Start recording
    // ---------------------------------

    async function startRecording() {
      try {
        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia ||
          typeof MediaRecorder === "undefined"
        ) {
          throw new Error("Recording not supported");
        }

        stream = await navigator.mediaDevices.getUserMedia({
          audio: true
        });

        const mime =
          MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
            ? "audio/webm;codecs=opus"
            : "";

        recorder = new MediaRecorder(
          stream,
          mime ? { mimeType: mime } : undefined
        );

        chunks = [];
        wavBytes = null;

        submitAfterStop = false;
        discardAfterStop = false;
        maxDurationReached = false;

        recordingStartedAt = 0;

        recordingTime.hidden = true;
        preview.hidden = true;
        download.hidden = true;

        recorder.ondataavailable = event => {
          if (event.data.size > 0) {
            chunks.push(event.data);
          }
        };

        recorder.onerror = event => {
          console.error("MediaRecorder error:", event);

          status.textContent =
            "Recording error. Please try again.";
        };

        recorder.onstop = finishRecording;

        recorder.start();

        recordingStartedAt = Date.now();

        recordingTime.hidden = false;
        updateRecordingTime();

        recordingClockInterval = setInterval(
          updateRecordingTime,
          1000
        );

        maxRecordingTimer = setTimeout(() => {
          if (recorder && recorder.state === "recording") {
            maxDurationReached = true;

            status.textContent =
              "Maximum 10 minutes reached. Preparing recording…";

            recorder.stop();
          }
        }, 600000);

        recordButton.textContent = "Stop recording";

        status.textContent =
          "Recording… Click Stop recording or the action button to submit.";

        saveButton.disabled = false;

      } catch (error) {
        console.error("Microphone access failed:", error);

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
        }

        stream = null;

        status.textContent =
          "Microphone access is unavailable. Allow microphone access and try again.";

        saveButton.disabled = false;
        recordButton.textContent = "Start recording";
      }

      scheduleHeightUpdate();
    }

    // ---------------------------------
    // Submit audio to Python
    // ---------------------------------

    function submitSample() {
      if (!wavBytes) {
        status.textContent = "Record a voice sample first.";
        return;
      }

      saveButton.disabled = true;

      status.textContent =
        "Submitting your voice sample…";

      post("streamlit:setComponentValue", {
        dataType: "json",
        value: {
          submitted: true,
          request_id: `${Date.now()}-${++requestId}`,
          audio_base64: bytesToBase64(wavBytes)
        }
      });
    }

    // ---------------------------------
    // Record button
    // ---------------------------------

    recordButton.addEventListener("click", async () => {
      if (recorder && recorder.state === "recording") {
        submitAfterStop = false;

        recordButton.disabled = true;

        status.textContent = "Finishing recording…";

        recorder.stop();

      } else {
        await startRecording();
      }
    });

    // ---------------------------------
    // Save button
    // ---------------------------------

    saveButton.addEventListener("click", () => {
      if (recorder && recorder.state === "recording") {
        submitAfterStop = true;

        saveButton.disabled = true;
        recordButton.disabled = true;

        status.textContent =
          "Stopping and preparing the sample…";

        recorder.stop();

      } else if (wavBytes) {
        submitSample();

      } else {
        status.textContent = "Record a voice sample first.";
      }
    });

    // ---------------------------------
    // Clear button
    // ---------------------------------

    clearButton.addEventListener("click", () => {
      submitAfterStop = false;

      if (recorder && recorder.state === "recording") {
        discardAfterStop = true;
        recorder.stop();
      }

      chunks = [];
      wavBytes = null;

      clearRecordingTimers();

      recordingStartedAt = 0;
      recordingTime.hidden = true;

      if (preview.src.startsWith("blob:")) {
        URL.revokeObjectURL(preview.src);
      }

      preview.removeAttribute("src");
      preview.hidden = true;

      download.removeAttribute("href");
      download.hidden = true;

      saveButton.disabled = false;
      recordButton.disabled = false;

      status.textContent =
        "Sample cleared. Record a clear voice sample.";

      scheduleHeightUpdate();
    });

    // ---------------------------------
    // Streamlit render messages
    // ---------------------------------

    window.addEventListener("message", event => {
      if (!event.data) return;

      if (event.data.type === "streamlit:render") {
        const args = event.data.args || {};

        saveButton.textContent =
          args.action_label || "Create account";

        scheduleHeightUpdate();
      }
    });

    // ---------------------------------
    // Initialize component
    // ---------------------------------

    // Small initial height; actual content height follows.
    post("streamlit:setFrameHeight", {
      height: 100
    });

    post("streamlit:componentReady", {
      apiVersion: 1
    });

    scheduleHeightUpdate();

  </script>

</body>
</html>
